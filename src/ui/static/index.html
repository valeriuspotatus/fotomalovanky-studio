<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fotomalovánky — review</title>
<style>
 /* Dark by default. The operator reviews photographs for an hour at a stretch; a white page
    beside a white coloring page is the wrong thing to stare at. The one surface that stays
    white is the artwork itself — that white *is* the paper, and judging ink on it is the job. */
 :root{color-scheme:dark;
       --bg:#14161a;--panel:#1c1f25;--sunken:#22262e;--line:#333842;
       --text:#e6e8ec;--muted:#9aa1ac;--faint:#7a828d;
       --bad:#ff6b6b;--good:#3ecf78;--hold:#5aa9f7;--manual:#e0a33e;--on-accent:#0d1117}
 *{box-sizing:border-box}
 body{font:15px/1.55 system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--text)}
 .bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
      padding:11px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
      box-shadow:0 1px 4px rgba(0,0,0,.5)}
 .bar h1{font-size:17px;margin:0;font-weight:600}
 .bar .grow{flex:1}
 .chip{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--sunken)}
 .chip.hold{border-color:var(--bad);color:var(--bad)}
 .chip.ready{border-color:var(--good);color:var(--good)}
 .wrap{max-width:1560px;margin:0 auto;padding:20px 22px 90px}
 .empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:44px;text-align:center;color:var(--muted)}
 .empty code{background:var(--sunken);padding:2px 6px;border-radius:4px}
 .order{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:18px 0;overflow:hidden}
 .order>header{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .order h2{font-size:16px;margin:0}
 .order .note{font-size:12px;color:var(--faint)}
 .ded{display:flex;align-items:center;gap:7px;flex:1;min-width:320px}
 .ded label{font-size:12px;color:var(--muted);white-space:nowrap}
 .ded input{flex:1;font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;
      background:var(--sunken);color:var(--text)}
 .ded input:focus{background:#171a20;outline:2px solid rgba(90,169,247,.45);border-color:var(--hold)}
 .ded .warn{font-size:11.5px;color:var(--manual);white-space:nowrap}
 .ded .restore{font:inherit;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;
               background:var(--sunken);color:var(--text);cursor:pointer;white-space:nowrap}
 .ded .restore:hover:not(:disabled){border-color:var(--hold)}
 #queue{margin:0 18px 10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
 #queue .head{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 #queue .head .grow{flex:1}
 #queue .head button{font:inherit;font-size:11.5px;padding:2px 8px;border:1px solid var(--line);
                     border-radius:5px;background:var(--sunken);color:var(--text);cursor:pointer}
 #queue .list{display:flex;flex-wrap:wrap;gap:6px 16px}
 #queue label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
 #queue label.off{color:var(--muted)}
 #queue .n{font-size:11.5px;color:var(--muted)}
 #earlier{margin:26px 0 40px}
 #earlier .divider{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--muted);font-size:12.5px}
 #earlier .divider hr{flex:1;border:0;border-top:1px solid var(--line)}
 #earlier .divider button{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);
                          border-radius:5px;background:var(--sunken);color:var(--text);cursor:pointer}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;padding:16px;align-items:start}
 .tile{border:1px solid var(--line);border-radius:8px;padding:11px;position:relative;background:var(--sunken)}
 .tile.flagged,.tile.failed{border-color:var(--bad);box-shadow:0 0 0 2px rgba(255,107,107,.16) inset}
 .tile.pending_review{border-color:var(--hold);box-shadow:0 0 0 2px rgba(90,169,247,.16) inset}
 .tile.manual_in_progress{border-color:var(--manual);box-shadow:0 0 0 2px rgba(224,163,62,.16) inset}
 .tile.approved{border-color:var(--good);box-shadow:0 0 0 2px rgba(62,207,120,.16) inset}
 .tile.pending{border-style:dashed;background:#1a1d23}
 .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .imgs figure{margin:0;min-height:90px;display:flex;flex-direction:column}
 /* The artwork keeps its white paper: this is what the operator is judging. */
 .imgs img{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;display:block;cursor:zoom-in}
 .ph{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);
     border-radius:4px;color:var(--faint);font-size:13px;min-height:120px;text-align:center;padding:8px}
 figcaption{font-size:11px;color:var(--faint);text-align:center;margin-top:4px}
 .name{font:12px/1.4 ui-monospace,monospace;color:var(--muted);margin:9px 0 2px;word-break:break-all}
 .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
 .pill.ok{color:var(--good);border-color:var(--good)}
 .pill.approved{color:var(--on-accent);background:var(--good);border-color:var(--good)}
 .pill.flagged,.pill.failed{color:var(--on-accent);background:var(--bad);border-color:var(--bad)}
 .pill.pending_review{color:var(--on-accent);background:var(--hold);border-color:var(--hold)}
 .pill.manual_in_progress{color:var(--on-accent);background:var(--manual);border-color:var(--manual)}
 .pill.pending{color:var(--faint);border-color:#4a515b}
 .why{font-size:12px;color:var(--muted);margin:5px 0 0}
 .why.err{color:var(--bad);font-family:ui-monospace,monospace;word-break:break-word}
 .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
 button{padding:6px 12px;border-radius:6px;border:1px solid #454c56;background:#2a2f38;color:var(--text);
        cursor:pointer;font:inherit;font-size:13px}
 button:hover:not(:disabled){background:#343a45;border-color:#565e6a}
 button:disabled{opacity:.4;cursor:default}
 button.primary{border-color:var(--good);color:var(--good);font-weight:600;background:rgba(62,207,120,.10)}
 button.primary:hover:not(:disabled){background:rgba(62,207,120,.18)}
 button.danger{border-color:var(--bad);color:var(--bad);background:rgba(255,107,107,.10)}
 button.danger:hover:not(:disabled){background:rgba(255,107,107,.18)}
 .busy{display:flex;align-items:center;gap:9px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
       font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
 .spin{width:13px;height:13px;border:2px solid #3d434d;border-top-color:var(--hold);border-radius:50%;animation:s .8s linear infinite;flex:none}
 @keyframes s{to{transform:rotate(360deg)}}
 .manualbox{background:rgba(224,163,62,.10);border:1px solid rgba(224,163,62,.35);border-radius:6px;
      padding:9px 10px;margin-top:9px;font-size:12.5px;color:#f0d4a0}
 .manualbox code{background:var(--bg);border:1px solid rgba(224,163,62,.30);border-radius:3px;padding:1px 5px;font-size:11.5px}
 .go{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 .go label{font-size:13px;color:var(--muted);white-space:nowrap}
 .go input[type=text]{flex:1;min-width:300px;font:13px/1.4 ui-monospace,monospace;padding:7px 10px;
      border:1px solid var(--line);border-radius:6px;background:var(--sunken);color:var(--text)}
 .go input[type=text]::placeholder{color:var(--faint)}
 .go input[type=text]:focus{background:#171a20;outline:2px solid rgba(90,169,247,.45);border-color:var(--hold)}
 .go .primary{font-weight:600;padding:8px 22px;font-size:14px}
 .go .chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
 #runpanel{background:#0c0e12;color:#c9ced6;border-bottom:1px solid #000;max-height:230px;overflow:auto;
      padding:11px 22px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
 #runpanel .hdr{color:#8fd6a0;font-weight:600}
 #runpanel .err{color:#ff8b8b}
 #runpanel .warn{color:#ffcf7a}
 #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b313a;color:#fff;
        border:1px solid #454c56;
        padding:11px 17px;border-radius:8px;max-width:min(760px,92vw);box-shadow:0 6px 22px rgba(0,0,0,.6);
        opacity:0;pointer-events:none;transition:opacity .18s;z-index:20;font-size:14px}
 #toast.show{opacity:1}
 #toast.err{background:#7a2020;border-color:#a13030}
 dialog{border:none;border-radius:8px;padding:0;max-width:96vw;max-height:96vh;background:var(--panel)}
 dialog img{max-width:96vw;max-height:96vh;cursor:zoom-out;display:block;background:#fff}
 dialog::backdrop{background:rgba(0,0,0,.86)}
</style>
</head>
<body>
<div class="bar">
  <h1>Review</h1>
  <span class="chip" id="c-orders">—</span>
  <span class="chip hold" id="c-hold" hidden></span>
  <span class="chip ready" id="c-ready" hidden></span>
  <span class="grow"></span>
  <span class="chip" id="c-live">live</span>
</div>

<div class="go">
  <label for="inbox">Order photos</label>
  <input type="text" id="inbox" spellcheck="false" placeholder="the folder your Chrome extension downloads into">
  <button id="browse">Browse…</button>
  <button class="primary" id="run">Go</button>
  <label class="chk"><input type="checkbox" id="force"> reprint finished PDFs</label>
</div>

<div id="queue" hidden></div>

<div id="runpanel" hidden></div>

<div class="wrap"><div id="root"></div><div id="earlier"></div></div>

<div id="toast"></div>
<dialog id="lb"><img id="lbimg" alt=""></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = encodeURIComponent;

const LABEL = {
  ok: 'clean', approved: 'approved', flagged: 'needs review',
  pending_review: 'repaired — needs approval', manual_in_progress: 'out for manual repair',
  failed: 'failed', pending: 'not generated yet',
};

// Photos that need the operator come first — that is the entire job of this page. Within a
// group, keep the order's natural photo order (img0001, img0002, …).
const RANK = { failed: 0, flagged: 1, pending_review: 2, manual_in_progress: 3, pending: 4, ok: 5, approved: 6 };
const byAttention = (a, b) =>
  RANK[a.status ?? 'pending'] - RANK[b.status ?? 'pending'] || a.base.localeCompare(b.base, 'en', { numeric: true });

let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), isErr ? 7000 : 2600);
}

async function act(orderId, base, action) {
  for (const b of document.querySelectorAll(`[data-key="${CSS.escape(orderId + '/' + base)}"] button`)) b.disabled = true;
  try {
    const res = await fetch(`/api/${enc(orderId)}/${enc(base)}/${action}`, { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `${action} failed (HTTP ${res.status})`);
    if (action === 'redo') toast('Regenerating — this takes a couple of minutes.');
  } catch (err) {
    toast(err.message, true);
  }
  // Force the repaint: a refused action leaves the state identical, and the buttons this
  // click disabled would otherwise stay disabled.
  await refresh(true);
}

async function open(what, orderId) {
  const res = await fetch(`/api/_open/${what}${orderId ? '/' + enc(orderId) : ''}`, { method: 'POST' });
  const body = await res.json().catch(() => ({}));
  if (!body.opened) toast('Could not open it from here — open it yourself.', true);
}

const INBOX_KEY = 'fma:inbox';
const EARLIER_KEY = 'fma:earlier';
let showEarlier = localStorage.getItem(EARLIER_KEY) === '1';

// Clicking Go blurs the title-page box, so its save is already in flight when the run starts.
// The server refuses a dedication once a run is active, so let the save land first — otherwise
// the click that starts the book is the click that throws its title page away.
let pendingSave = Promise.resolve();

/** The orders found in the chosen folder, and which of them the operator ticked. Repainted only
 *  when something actually changed: a poll that redrew this would fight the tick under the mouse. */
let lastQueueSig = null;
function paintQueue(queue, selected, locked) {
  const q = $('#queue');
  if (!queue?.length) {
    q.hidden = true;
    lastQueueSig = null;
    return;
  }
  const sel = new Set(selected ?? queue.map((o) => o.orderId));
  const sig = JSON.stringify([queue, [...sel], locked]);
  if (sig === lastQueueSig) return;
  lastQueueSig = sig;

  q.hidden = false;
  q.innerHTML = `
    <div class="head">
      <b>${queue.length} order${queue.length > 1 ? 's' : ''} in this folder</b>
      <span class="n">${sel.size} ticked${sel.size > 1 ? ' — they run one after another' : ''}</span>
      <span class="grow"></span>
      <button data-tick="all"${locked || sel.size === queue.length ? ' disabled' : ''}>tick all</button>
      <button data-tick="none"${locked || sel.size === 0 ? ' disabled' : ''}>tick none</button>
    </div>
    <div class="list">${queue
      .map(
        (o) => `<label class="${sel.has(o.orderId) ? '' : 'off'}">
          <input type="checkbox" data-order="${esc(o.orderId)}"${sel.has(o.orderId) ? ' checked' : ''}${locked ? ' disabled' : ''}>
          <span>${esc(o.orderId)}</span><span class="n">${o.photos} photo${o.photos > 1 ? 's' : ''}</span>
        </label>`,
      )
      .join('')}</div>`;
}

/** Look inside a folder. Spends nothing and starts nothing — it is how the operator finds out
 *  what is in there before committing the GPU to it. */
async function scan(path) {
  try {
    const res = await fetch('/api/_scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `could not read that folder (HTTP ${res.status})`);
    $('#inbox').value = body.inbox;
    localStorage.setItem(INBOX_KEY, body.inbox);
    if (!body.orders.length) toast('No orders in that folder — it needs .jpg photos.', true);
    else if (!body.selected.length) toast(`${body.orders.length} orders in there — tick the ones you want.`);
  } catch (err) {
    toast(err.message, true);
  }
  await refresh(true);
}

async function select(orders) {
  try {
    const res = await fetch('/api/_select', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orders }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'could not change the ticks');
  } catch (err) {
    toast(err.message, true);
  }
  await refresh(true);
}

const tickedOrders = () => [...document.querySelectorAll('#queue input[type=checkbox]')].filter((c) => c.checked).map((c) => c.dataset.order);

async function startRun() {
  await pendingSave.catch(() => {});
  const inbox = $('#inbox').value.trim();
  try {
    const res = await fetch('/api/_run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inbox, force: $('#force').checked }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `could not start (HTTP ${res.status})`);
    if (inbox) localStorage.setItem(INBOX_KEY, inbox);
    toast('Running. Generating a photo takes a couple of minutes.');
  } catch (err) {
    toast(err.message, true);
  }
  await refresh(true);
}

async function browse() {
  const btn = $('#browse');
  btn.disabled = true;
  btn.textContent = 'Choose a folder…';
  try {
    const { path, available } = await (
      await fetch('/api/_pick-folder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ startAt: $('#inbox').value.trim() }), // open where they left off
      })
    ).json();
    if (path) {
      $('#inbox').value = path;
      localStorage.setItem(INBOX_KEY, path);
      await scan(path); // show what is in there, ticked and ready, before they press Go
    } else if (!available) {
      // Cancelling gives no path either, and that is not worth a warning. Only a dialog that
      // never appeared is.
      toast('Could not open the folder picker — type or paste the path into the box instead.', true);
    }
  } catch {
    toast('Could not open the folder picker — type or paste the path into the box instead.', true);
  }
  btn.disabled = false;
  btn.textContent = 'Browse…';
}

/** The run log lives outside #root so a new line never repaints (and refetches) the grid. */
function paintRun(run) {
  const panel = $('#runpanel');
  const has = run.active || run.report || run.error;
  panel.hidden = !has;
  if (!has) return;

  const parts = [];
  if (run.lines.length) parts.push(esc(run.lines.join('\n')));
  if (run.error) parts.push(`<span class="err">Run stopped: ${esc(run.error)}</span>`);
  if (run.report) {
    const c = run.report.counts;
    parts.push(`\n<span class="hdr">${c.done} done, ${c.held} waiting for you, ${c.failed} failed.</span>`);
    for (const o of run.report.orders) {
      if (o.status === 'failed') parts.push(`<span class="err">  ${esc(o.orderId)}  FAILED  ${esc(o.reason)}</span>`);
      else if (o.status === 'held') parts.push(`  ${esc(o.orderId)}  held    ${esc(o.reason)}`);
      else parts.push(`  ${esc(o.orderId)}  done    PDF written${o.titled ? '' : ' (no dedication)'}`);
    }
  }
  const html = parts.join('\n');
  if (panel.dataset.html === html) return; // don't fight the operator's scrollbar
  panel.dataset.html = html;
  const pinned = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 24;
  panel.innerHTML = html;
  if (pinned) panel.scrollTop = panel.scrollHeight;
}

let runActive = false;

function paintGoBar(data) {
  const running = (runActive = data.run.active);
  $('#run').disabled = running;
  $('#run').textContent = running ? 'Running…' : 'Go';
  $('#browse').disabled = running;
  $('#force').disabled = running;
  const inbox = $('#inbox');
  if (document.activeElement !== inbox && !inbox.value) inbox.value = localStorage.getItem(INBOX_KEY) || data.inbox || '';
  paintQueue(data.queue, data.selected, running);
}

async function saveDedication(orderId, text) {
  try {
    const res = await fetch(`/api/${enc(orderId)}/dedication`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'could not save the title page text');
    toast(body.dedication ? 'Title page saved.' : 'Title page cleared — this book will print without a dedication.');
  } catch (err) {
    toast(err.message, true);
  }
  await refresh(true);
}

function tile(orderId, orderDir, p, locked) {
  const status = p.status ?? 'pending';
  const key = orderId + '/' + p.base;
  const busy = p.busy;

  const shot = (kind, cap) => {
    const has = kind === 'coloring' ? p.hasColoring : p.hasOriginal;
    if (!has) return `<figure><div class="ph">${kind === 'coloring' ? 'no line-art yet' : 'photo purged'}</div><figcaption>${cap}</figcaption></figure>`;
    const v = kind === 'coloring' ? `?v=${p.coloringVersion}` : '';
    return `<figure><img loading="lazy" src="/img/${enc(orderId)}/${enc(p.base)}/${kind}${v}" alt="${esc(cap)}"><figcaption>${cap}</figcaption></figure>`;
  };

  let why = '';
  if (status === 'failed') why = `<p class="why err">${esc(p.reason)}</p>`;
  else if (status === 'flagged' && p.reason && p.reason !== 'ok') why = `<p class="why">auto-flagged: ${esc(p.reason)}</p>`;
  else if (p.reason && p.reason !== 'ok') why = `<p class="why">${esc(p.reason)}</p>`;

  let acts = '';
  if (busy) {
    acts = `<div class="busy"><div class="spin"></div><span>${esc(busy.message)}</span></div>`;
  } else if (status === 'pending') {
    acts = `<div class="busy"><div class="spin"></div><span>waiting for the batch to reach this photo</span></div>`;
  } else if (status === 'manual_in_progress') {
    acts = `<div class="manualbox">
        Repair it, then save <code>${esc(p.base)}.svg</code> and <code>${esc(p.base)}_bw.png</code> into<br>
        <code>${esc(orderDir)}</code>
      </div>
      <div class="acts">
        <button class="primary" data-a="replaced">I've replaced it</button>
        <button data-open="generator">Open generator</button>
        <button data-open="folder">Open folder</button>
        <button data-a="redo">Give up, regenerate</button>
      </div>`;
  } else if (status === 'failed') {
    acts = `<div class="acts"><button class="danger" data-a="redo">Try again</button></div>`;
  } else if (status === 'approved') {
    acts = `<div class="acts"><button class="danger" data-a="reject">Mark bad</button></div>`;
  } else if (status === 'ok') {
    acts = `<div class="acts">
        <button class="danger" data-a="reject">Mark bad</button>
        <button data-a="redo">Redo</button>
        <button data-a="handoff">Fix by hand</button>
      </div>`;
  } else {
    // flagged / pending_review — the two states that hold the order back.
    acts = `<div class="acts">
        <button class="primary" data-a="approve">Approve</button>
        <button data-a="redo">Redo</button>
        <button data-a="handoff">Fix by hand</button>
      </div>`;
  }

  // A run rewrites each order's state.json as it goes; a verdict saved meanwhile would be
  // overwritten. The server refuses them, so don't offer them.
  if (locked) acts = acts.replaceAll('<button ', '<button disabled ');

  return `<div class="tile ${status}" data-key="${esc(key)}" data-order="${esc(orderId)}" data-base="${esc(p.base)}">
    <div class="imgs">${shot('original', 'original photo')}${shot('coloring', 'coloring page')}</div>
    <p class="name">${esc(p.base)}</p>
    <span class="pill ${status}">${LABEL[status]}</span>
    ${why}
    ${acts}
  </div>`;
}

// Everything the DOM depends on, except the progress *text* of an in-flight redo. Re-rendering
// on every poll would refetch every (no-store) thumbnail and flicker the page under the
// operator's cursor, so a poll that changed nothing repaints nothing.
const skeletonOf = (data) =>
  JSON.stringify({
    orders: data.orders.map((o) => ({ ...o, photos: o.photos.map(({ busy, ...p }) => ({ ...p, busy: Boolean(busy) })) })),
    // A run's log lines are not in here: they arrive every second and are painted separately,
    // so a long run does not repaint (and refetch every thumbnail of) the grid.
    running: data.run.active,
    finished: Boolean(data.run.report || data.run.error),
  });

function patchProgress(data) {
  for (const o of data.orders) {
    for (const p of o.photos) {
      const span = document.querySelector(`[data-key="${CSS.escape(o.orderId + '/' + p.base)}"] .busy span`);
      // A finished redo has no message left. Leaving the last one on screen is what made a
      // finished photo read as "still vectorizing" until something forced a repaint.
      if (span) span.textContent = p.busy ? p.busy.message : '';
    }
  }
}

/** The operator may be typing a title page while a poll repaints the grid. Carry their text and
 *  their caret across it. Freezing the grid instead — the old fix — stops every tile in every
 *  order from updating for as long as the cursor rests in one box. */
function captureFocus() {
  const el = document.activeElement;
  if (!el?.matches?.('.ded input')) return null;
  return {
    order: el.closest('.ded').dataset.order,
    value: el.value,
    entry: el.dataset.entry ?? el.value,
    start: el.selectionStart,
    end: el.selectionEnd,
  };
}

function restoreFocus(snap) {
  if (!snap) return;
  const el = document.querySelector(`.ded[data-order="${CSS.escape(snap.order)}"] input`);
  if (!el || el.disabled) return;
  el.value = snap.value; // the operator's text, never the server's
  el.focus();
  // focus() fires focusin, which would reset the baseline to the text we just restored and so
  // swallow the edit they were in the middle of. Put the original baseline back.
  el.dataset.entry = snap.entry;
  try {
    el.setSelectionRange(snap.start, snap.end);
  } catch {}
}

function orderSection(o, locked) {
  const s = o.summary;
  const note = o.dirName && o.dirName !== o.orderId ? `<span class="note">folder: ${esc(o.dirName)}</span>` : '';
  const badge = s.ready
    ? `<span class="chip ready">ready — ${s.total} photo${s.total > 1 ? 's' : ''}</span>`
    : `<span class="chip hold">${s.eligible}/${s.total} ready</span>`;

  // An untouched order shows the text recovered from the photo names; the operator's own answer,
  // once given, always wins — including the answer of emptying the box, which is undoable.
  const shown = o.dedication || o.suggestedDedication;
  let hint = '';
  if (!o.dedication) {
    if (o.suggestedDedication) hint = '<span class="note">from the photo names</span>';
    else if (o.clearedDedication)
      hint =
        `<span class="note">no dedication — was “${esc(o.clearedDedication)}”</span>` +
        `<button class="restore" data-restore="${esc(o.clearedDedication)}"${locked ? ' disabled' : ''}>restore</button>`;
    else hint = '<span class="note">no dedication — the title page prints without text</span>';
  }
  const ded = `<div class="ded" data-order="${esc(o.orderId)}">
      <label for="ded-${esc(o.orderId)}">Title page</label>
      <input id="ded-${esc(o.orderId)}" value="${esc(shown)}"${locked ? ' disabled' : ''} placeholder="no dedication — the title page will have no text">
      ${hint}
    </div>`;
  return `<section class="order">
    <header><h2>Order ${esc(o.orderId)}</h2>${note}${badge}${ded}</header>
    <div class="grid">${[...o.photos].sort(byAttention).map((p) => tile(o.orderId, o.orderDir, p, locked)).join('')}</div>
  </section>`;
}

let lastSkeleton = null;
let repainting = false;

function render(data, force) {
  const root = $('#root');
  const orders = data.orders;

  // Always current, whether or not the grid repaints.
  paintRun(data.run);
  paintGoBar(data);

  const skeleton = skeletonOf(data);
  if (!force && skeleton === lastSkeleton) return patchProgress(data);
  lastSkeleton = skeleton;

  // Orders the operator is working on now, and orders that merely still exist in the outbox.
  // Piling last week's finished books under the one generating is how the grid became unreadable.
  const here = orders.filter((o) => o.inInbox);
  const primary = here.length ? here : orders;
  const earlier = here.length ? orders.filter((o) => !o.inInbox) : [];

  if (!primary.length) {
    root.innerHTML = `<div class="empty">
      <p><b>${data.run.active ? 'Working…' : 'Nothing here yet.'}</b></p>
      <p>${data.run.active ? 'Photos will appear as they finish.' : 'Choose the folder your order photos are in, tick the orders, then press <b>Go</b>.'}</p>
      <p style="font-size:13px;color:#888">Finished books go to <code>${esc(data.outbox)}</code></p></div>`;
    $('#earlier').innerHTML = '';
    $('#c-orders').textContent = 'no orders';
    $('#c-hold').hidden = true;
    $('#c-ready').hidden = true;
    return;
  }

  let held = 0, ready = 0;
  for (const o of primary) { held += o.summary.held + o.summary.failed; if (o.summary.ready) ready++; }
  $('#c-orders').textContent = `${primary.length} order${primary.length > 1 ? 's' : ''}`;
  $('#c-hold').hidden = !held;
  $('#c-hold').textContent = `${held} need${held === 1 ? 's' : ''} you`;
  $('#c-ready').hidden = !ready;
  $('#c-ready').textContent = `${ready} ready for the builder`;

  const locked = data.run.active;
  const divider = earlier.length
    ? `<div class="divider"><hr><span>${earlier.length} earlier order${earlier.length > 1 ? 's' : ''}, not in this folder</span>
         <button id="toggle-earlier">${showEarlier ? 'hide' : 'show'}</button><hr></div>`
    : '';

  // Removing a focused, dirty input can fire focusout. Suppress the save it would trigger —
  // the text is restored a line later, and the operator has not finished with it.
  const focused = captureFocus();
  repainting = true;
  root.innerHTML = primary.map((o) => orderSection(o, locked)).join('');
  $('#earlier').innerHTML = divider + (showEarlier ? earlier.map((o) => orderSection(o, locked)).join('') : '');
  repainting = false;
  restoreFocus(focused);
}

let inFlight = false;
async function refresh(force) {
  if (inFlight) return;
  inFlight = true;
  try {
    const res = await fetch('/api/state');
    render(await res.json(), force);
    $('#c-live').textContent = 'live';
  } catch {
    $('#c-live').textContent = 'disconnected — is the tool still running?';
  } finally {
    inFlight = false;
  }
}

// A photo that will not decode becomes a labelled placeholder, not a broken-image icon.
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.closest('.imgs')) return;
  const fig = img.closest('figure');
  const cap = fig.querySelector('figcaption')?.textContent ?? '';
  fig.innerHTML = `<div class="ph">unreadable file</div><figcaption>${esc(cap)}</figcaption>`;
}, true);

// The baseline for "did they actually change it". Everything else — a repaint, the window losing
// focus, a tab straight through the box, File Explorer opening over the page — leaves the value
// untouched, and so must write nothing. Customer text is not regenerable; the safe default when
// we are unsure whether the operator meant it is to do nothing.
document.addEventListener('focusin', (e) => {
  const input = e.target.closest?.('.ded input');
  if (input) input.dataset.entry = input.value;
});

// Save when the operator is done typing, not per keystroke. Driven off focusout rather than
// 'change': a repaint re-creates the input, which resets the browser's idea of "changed since
// focus", so a 'change' listener would silently drop the edit that survived the repaint.
document.addEventListener('focusout', (e) => {
  if (repainting) return;
  const input = e.target.closest?.('.ded input');
  if (!input) return;
  const entry = input.dataset.entry;
  if (entry === undefined || input.value === entry) return; // they looked; they did not touch
  pendingSave = saveDedication(input.closest('.ded').dataset.order, input.value);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.closest('.ded input')) e.target.blur();
});

document.addEventListener('click', (e) => {
  const img = e.target.closest('.imgs img');
  if (img) { $('#lbimg').src = img.src; $('#lb').showModal(); return; }
  if (e.target === $('#lbimg') || e.target === $('#lb')) { $('#lb').close(); return; }

  const undo = e.target.closest('button[data-restore]');
  if (undo) {
    pendingSave = saveDedication(undo.closest('.ded').dataset.order, undo.dataset.restore);
    return;
  }

  const tick = e.target.closest('#queue button[data-tick]');
  if (tick) {
    const all = [...document.querySelectorAll('#queue input[type=checkbox]')].map((c) => c.dataset.order);
    select(tick.dataset.tick === 'all' ? all : []);
    return;
  }

  if (e.target.closest('#toggle-earlier')) {
    showEarlier = !showEarlier;
    localStorage.setItem(EARLIER_KEY, showEarlier ? '1' : '0');
    refresh(true);
    return;
  }

  const btn = e.target.closest('button[data-a],button[data-open]');
  if (!btn) return;
  const t = btn.closest('.tile');
  if (btn.dataset.a) act(t.dataset.order, t.dataset.base, btn.dataset.a);
  else open(btn.dataset.open, t.dataset.order);
});

// Ticking an order changes what Go will work through, and what the grid shows.
document.addEventListener('change', (e) => {
  if (e.target.closest('#queue input[type=checkbox]')) select(tickedOrders());
});

$('#run').addEventListener('click', startRun);
$('#browse').addEventListener('click', browse);
$('#inbox').addEventListener('change', () => localStorage.setItem(INBOX_KEY, $('#inbox').value.trim()));
// Enter looks inside the folder rather than starting a run. Typing a path and immediately
// spending the GPU on whatever happens to be in it is not a thing to do by accident.
$('#inbox').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !$('#run').disabled) scan($('#inbox').value.trim());
});

// The server does not know the folder the operator chose last time; the browser does. Scan *that*
// — never whatever ends up in the box, because paintGoBar seeds it with the server's configured
// default, and scanning a default that does not exist greets them with a red error for doing
// nothing but opening the page. And never mid-run, when a scan is rightly refused.
const remembered = localStorage.getItem(INBOX_KEY) || '';
$('#inbox').value = remembered;
refresh().then(() => {
  if (remembered && !runActive) scan(remembered);
});
setInterval(refresh, 1500);
</script>
</body>
</html>
